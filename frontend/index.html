<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatCars</title>
  <!-- Tailwind CDN versi 2.x (ringan & sesuai UI lamamu) -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <style>
    /* sentuhan kecil agar mirip screenshot: */
    .thin-scrollbar::-webkit-scrollbar{width:6px}
    .thin-scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}
    .thin-scrollbar{scrollbar-width:thin}
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-start justify-center p-4 sm:p-6">
  <div class="w-full max-w-2xl">
    <!-- KARTU UTAMA -->
    <div class="bg-white shadow-lg rounded-lg border border-gray-200">
      <!-- HEADER -->
      <div class="flex items-center justify-center px-5 pt-4">
        <h1 class="text-xl sm:text-2xl font-bold text-blue-600 text-center">
          🚗 ChatCars: Rekomendasi Mobil
        </h1>
      </div>
      <!-- Link saran kecil di kanan -->
      <div class="px-5 mt-1 mb-2 text-right text-xs">
        <a id="quickLink" href="#" class="text-blue-600 hover:text-blue-700 hover:underline">
          rekomendasi mobil diesel dibawah 5 tahun
        </a>
      </div>

      <!-- AREA CHAT (ber-scroll) -->
      <div class="px-5">
        <div id="chatBox"
             class="h-96 sm:h-112 overflow-y-auto thin-scrollbar p-3 border rounded bg-gray-50 text-sm">
          <!-- Info kecil di atas -->
          <div class="flex items-center text-gray-500 text-xs mb-2">
            <span class="mr-1">🔔</span> Rekomendasi berdasarkan Cosine Similarity.
          </div>
          <!-- pesan akan ditambahkan via JS -->
        </div>
      </div>

      <!-- INPUT -->
      <div class="px-5 pb-4 pt-2">
        <div class="flex space-x-2">
          <input id="pertanyaan" type="text"
                 placeholder="Tanyakan sesuatu tentang mobil..."
                 class="flex-grow px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-300"/>
          <button id="kirimBtn"
                  class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
            Kirim
          </button>
        </div>
        <p class="text-gray-400 text-xs mt-1">
          Contoh: <em>“BMW diesel matic lebih dari 500 juta”</em>
        </p>
      </div>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById("chatBox");
    const input   = document.getElementById("pertanyaan");
    const btn     = document.getElementById("kirimBtn");
    const quick   = document.getElementById("quickLink");

    function addUser(text){
      const el = document.createElement("div");
      el.className = "text-right text-blue-700 font-medium mb-2";
      el.textContent = "👤 " + text;
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    function addBotHTML(html){
      const el = document.createElement("div");
      el.className = "text-left text-gray-800 whitespace-pre-wrap mb-2";
      el.innerHTML = html;
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function block(title, body){
      return `
        <div class="border rounded bg-white p-3 mb-3">
          ${title?`<div class="font-semibold mb-2">${title}</div>`:""}
          ${body||""}
        </div>
      `;
    }

    function renderRecs(title, list){
      let inner = "";
      if(!list || list.length===0){
        inner += `<div class="text-gray-500 text-sm">Tidak ditemukan rekomendasi yang cocok.</div>`;
      } else {
        list.forEach((r,i)=>{
          inner += `
            <div class="border rounded p-3 mb-3 bg-white">
              <div class="font-semibold text-gray-800">${i+1}. ${r.nama_mobil||"-"} ${r.tahun?`(${r.tahun})`:""}</div>
              ${r.cosine_score!==undefined?`<div class="text-gray-500 text-xs">Skor: ${(+(r.cosine_score)).toFixed(4)}</div>`:""}
              <div class="mt-3 space-y-1 text-sm">
                <div>Harga: <b>${r.harga||"-"}</b></div>
                <div>Usia: <b>${r.usia||"-"}</b> tahun</div>
                <div>Bahan Bakar: <span>${r.bahan_bakar||"-"}</span></div>
                <div>Transmisi: <span>${r.transmisi||"-"}</span></div>
                <div>Kapasitas Mesin: <span>${r.kapasitas_mesin||"-"}</span></div>
              </div>
            </div>
          `;
        });
      }
      return block(`<span class="text-gray-700"> ${title||"Rekomendasi berdasarkan Cosine Similarity:"}</span>`, inner);
    }

    async function getJSON(url){
      const res = await fetch(url);
      if(!res.ok) throw new Error("HTTP "+res.status);
      return res.json();
    }

    async function kirimPertanyaan(){
      const q = input.value.trim();
      if(!q) return;
      addUser(q);

      // loader
      const loader = document.createElement("div");
      loader.className = "text-left text-gray-600 mb-2";
      loader.textContent = "🤖 mengetik...";
      chatBox.appendChild(loader);
      chatBox.scrollTop = chatBox.scrollHeight;

      input.value = ""; input.disabled = true; btn.disabled = true;

      try{
        let data;
        try{
          data = await getJSON(`/api/ask?pertanyaan=${encodeURIComponent(q)}&topk=5`);
        }catch(_){
          data = await getJSON(`/api/rule?pertanyaan=${encodeURIComponent(q)}&topk=5`);
        }
        loader.remove();

        const title = data?.jawaban || "Rekomendasi berdasarkan Cosine Similarity:";
        const list  = data?.rekomendasi || [];
        addBotHTML( renderRecs(title, list) );
      }catch(e){
        loader.remove();
        addBotHTML(`<div class="text-red-600">❌ Gagal mengambil jawaban (${e.message}).</div>`);
      }finally{
        input.disabled = false; btn.disabled = false; input.focus();
      }
    }

    btn.addEventListener("click", kirimPertanyaan);
    input.addEventListener("keypress", e => { if(e.key==="Enter") kirimPertanyaan(); });
    quick.addEventListener("click", (e)=>{
      e.preventDefault();
      input.value = "";
      addUser(quick.textContent.trim());
      // langsung pakai teks link sebagai pertanyaan
      (async ()=>{
        const q = quick.textContent.trim();
        const loader = document.createElement("div");
        loader.className = "text-left text-gray-600 mb-2";
        loader.textContent = "🤖 mengetik...";
        chatBox.appendChild(loader);
        try{
          let data;
          try{
            data = await getJSON(`/api/ask?pertanyaan=${encodeURIComponent(q)}&topk=5`);
          }catch(_){
            data = await getJSON(`/api/rule?pertanyaan=${encodeURIComponent(q)}&topk=5`);
          }
          loader.remove();
          addBotHTML( renderRecs(data?.jawaban, data?.rekomendasi) );
        }catch(e){
          loader.remove();
          addBotHTML(`<div class="text-red-600">❌ Gagal mengambil jawaban (${e.message}).</div>`);
        }
      })();
    });
  </script>
</body>
</html>
