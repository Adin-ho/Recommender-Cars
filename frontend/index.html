<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatCars</title>
  <!-- TailwindCSS v2 (ringan & konsisten dgn UI lama) -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
  <style>
    /* Scrollbar tipis agar mirip UI sebelumnya */
    .thin-scrollbar::-webkit-scrollbar{width:6px;height:6px}
    .thin-scrollbar::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:9999px}
    .thin-scrollbar{scrollbar-width:thin}
    /* Bayangan lembut untuk kartu utama */
    .card { box-shadow: 0 6px 24px rgba(0,0,0,.06), 0 2px 6px rgba(0,0,0,.04); }
  </style>
</head>

<body class="bg-gray-100 min-h-screen flex items-start justify-center p-4 sm:p-6">
  <main class="w-full max-w-3xl">
    <!-- Kartu utama -->
    <section class="card bg-white rounded-xl border border-gray-200 overflow-hidden">
      <!-- Header -->
      <header class="px-6 pt-5 pb-1">
        <h1 class="text-2xl font-bold text-blue-600 text-center">
          🚗 ChatCars: Rekomendasi Mobil
        </h1>
        <div class="text-right text-xs mt-2">
          <a id="quickLink" href="#" class="text-blue-600 hover:text-blue-700 hover:underline">
            rekomendasi mobil diesel dibawah 5 tahun
          </a>
        </div>
      </header>

      <!-- Area hasil -->
      <section class="px-6">
        <!-- judul bagian kecil -->
        <div class="flex items-center text-gray-600 text-xs mb-2">
          <span class="inline-flex items-center justify-center w-5 h-5 rounded-full bg-blue-50 text-blue-600 mr-2">i</span>
          <span>Rekomendasi berdasarkan Cosine Similarity.</span>
        </div>

        <div id="chatBox"
             class="h-[480px] sm:h-[520px] overflow-y-auto thin-scrollbar p-3 bg-gray-50 border rounded-lg text-sm">
          <!-- konten dimuat via JS -->
        </div>
      </section>

      <!-- Input -->
      <footer class="px-6 pb-5 pt-3">
        <div class="flex space-x-2">
          <input id="pertanyaan" type="text"
                 placeholder="Tanyakan sesuatu tentang mobil..."
                 class="flex-grow px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-300"/>
          <button id="kirimBtn"
                  class="px-5 py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700">
            Kirim
          </button>
        </div>
        <p class="text-gray-400 text-xs mt-1">
          Contoh: <em>“BMW diesel matic lebih dari 500 juta”</em>
        </p>
      </footer>
    </section>
  </main>

  <script>
    const chatBox = document.getElementById("chatBox");
    const input   = document.getElementById("pertanyaan");
    const btn     = document.getElementById("kirimBtn");
    const quick   = document.getElementById("quickLink");

    // ===== Helpers UI =====
    function addUser(text){
      const el = document.createElement("div");
      el.className = "text-right mb-3";
      el.innerHTML = `<span class="inline-block bg-blue-50 text-blue-700 px-3 py-1 rounded-lg">👤 ${escapeHTML(text)}</span>`;
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    function addBotHTML(html){
      const el = document.createElement("div");
      el.className = "text-left mb-3";
      el.innerHTML = html;
      chatBox.appendChild(el);
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    function escapeHTML(s){ return s.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    // Blok judul + isi
    function sectionBlock(titleHTML, bodyHTML){
      return `
        <div class="bg-white border rounded-lg p-3">
          ${titleHTML ? `<div class="font-semibold mb-2 text-gray-800">${titleHTML}</div>` : ""}
          ${bodyHTML || ""}
        </div>
      `;
    }

    function renderRecs(title, list){
      // Header kecil di atas daftar
      const header = `
        <div class="flex items-center mb-3">
          <span class="inline-flex items-center justify-center w-6 h-6 mr-2 text-blue-600 bg-blue-50 rounded-full">✓</span>
          <span class="font-medium text-gray-700">${escapeHTML(title || "Rekomendasi berdasarkan Cosine Similarity:")}</span>
        </div>
      `;

      if(!list || list.length===0){
        return sectionBlock(header, `<div class="text-gray-500 text-sm">Tidak ditemukan rekomendasi yang cocok.</div>`);
      }

      let items = "";
      list.forEach((r,i)=>{
        const scoreLine = (r.cosine_score !== undefined && r.cosine_score !== null)
          ? `<div class="text-xs text-gray-500">Skor: <b>${Number(r.cosine_score).toFixed(4)}</b></div>` : "";

        items += `
          <article class="border rounded-lg p-4 bg-white mb-3">
            <div class="flex items-start">
              <!-- nomor bulat -->
              <div class="flex-shrink-0 w-7 h-7 rounded-full bg-blue-600 text-white flex items-center justify-center mr-3 text-xs font-semibold">${i+1}</div>
              <div class="flex-1">
                <div class="font-semibold text-gray-800">
                  ${escapeHTML(r.nama_mobil || "-")} ${r.tahun ? `(${escapeHTML(String(r.tahun))})` : ""}
                </div>
                ${scoreLine}
                <div class="mt-3 grid grid-cols-1 sm:grid-cols-2 gap-x-6 gap-y-1 text-sm">
                  <div>Harga: <b>${escapeHTML(r.harga || "-")}</b></div>
                  <div>Usia: <b>${escapeHTML((r.usia ?? "-")+"")}</b> tahun</div>
                  <div>Bahan Bakar: <span>${escapeHTML(r.bahan_bakar || "-")}</span></div>
                  <div>Transmisi: <span>${escapeHTML(r.transmisi || "-")}</span></div>
                  <div class="sm:col-span-2">Kapasitas Mesin: <span>${escapeHTML(r.kapasitas_mesin || "-")}</span></div>
                </div>
              </div>
            </div>
          </article>
        `;
      });

      return sectionBlock(header, items);
    }

    // ===== API helpers =====
    async function getJSON(url){
      const res = await fetch(url);
      if(!res.ok) throw new Error("HTTP "+res.status);
      return res.json();
    }
    async function askServer(q){
      // Coba /api/ask (rule-based + LLM) > fallback /api/rule (rule-based)
      try{
        return await getJSON(`/api/ask?pertanyaan=${encodeURIComponent(q)}&topk=5`);
      }catch(_){
        return await getJSON(`/api/rule?pertanyaan=${encodeURIComponent(q)}&topk=5`);
      }
    }

    // ===== Actions =====
    async function kirimPertanyaan(){
      const q = input.value.trim();
      if(!q) return;
      addUser(q);

      const loader = document.createElement("div");
      loader.className = "text-left text-gray-600 text-sm mb-2";
      loader.textContent = "🤖 mengetik…";
      chatBox.appendChild(loader);
      chatBox.scrollTop = chatBox.scrollHeight;

      input.value = ""; input.disabled = true; btn.disabled = true;
      try{
        const data = await askServer(q);
        loader.remove();

        const title = data?.jawaban || "Rekomendasi berdasarkan Cosine Similarity:";
        const list  = data?.rekomendasi || [];
        addBotHTML( renderRecs(title, list) );
      }catch(e){
        loader.remove();
        addBotHTML(`<div class="text-red-600">❌ Gagal mengambil jawaban (${e.message}).</div>`);
      }finally{
        input.disabled = false; btn.disabled = false; input.focus();
      }
    }

    // quick link = kirim pertanyaan preset
    quick.addEventListener("click", async (e)=>{
      e.preventDefault();
      const q = quick.textContent.trim();
      addUser(q);
      const loader = document.createElement("div");
      loader.className = "text-left text-gray-600 text-sm mb-2";
      loader.textContent = "🤖 mengetik…";
      chatBox.appendChild(loader);
      try{
        const data = await askServer(q);
        loader.remove();
        addBotHTML( renderRecs(data?.jawaban, data?.rekomendasi) );
      }catch(err){
        loader.remove();
        addBotHTML(`<div class="text-red-600">❌ Gagal mengambil jawaban (${err.message}).</div>`);
      }
    });

    btn.addEventListener("click", kirimPertanyaan);
    input.addEventListener("keypress", e => { if(e.key==="Enter") kirimPertanyaan(); });
  </script>
</body>
</html>
