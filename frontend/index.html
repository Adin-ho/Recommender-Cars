<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatCars</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
</head>
<body class="bg-gray-100 flex flex-col items-center h-screen p-4">
  <div class="flex flex-col w-full max-w-2xl bg-white shadow-lg rounded-lg p-6 h-full gap-2">
    <h1 class="text-2xl font-bold text-center text-blue-600 mb-2">🚗 Rekomendasi Mobil</h1>

    <div id="chatBox" class="flex-1 min-h-0 overflow-y-auto p-4 border rounded bg-gray-50 text-sm"></div>

    <div class="flex space-x-2">
      <input id="pertanyaan" type="text" placeholder="Tanyakan mobil... contoh: diesel matic di bawah 300 juta"
        class="flex-grow px-4 py-2 border rounded focus:outline-none focus:ring focus:border-blue-300"/>
      <button onclick="kirimPertanyaan()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Kirim</button>
    </div>

    <div class="text-xs text-gray-500 mt-1">Contoh: “BMW diesel matic lebih dari 500 juta”</div>
  </div>

<script>
const chatBox = document.getElementById("chatBox");
const input   = document.getElementById("pertanyaan");

async function fetchJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error("HTTP " + res.status);
  return await res.json();
}

async function kirimPertanyaan(){
  const pesan = input.value.trim();
  if(!pesan) return;

  const userMsg = document.createElement("div");
  userMsg.className = "text-right text-blue-700 mb-2";
  userMsg.textContent = "👤 " + pesan;
  chatBox.appendChild(userMsg);

  const botMsg = document.createElement("div");
  botMsg.className = "text-left text-gray-800 whitespace-pre-wrap";
  chatBox.appendChild(botMsg);

  botMsg.textContent = "🤖";
  const itv = setInterval(() => {
    botMsg.textContent += ".";
    if (botMsg.textContent.length > 8) botMsg.textContent = "🤖";
  }, 200);

  input.value = "";
  input.disabled = true;

  try {
    let data;
    // panggil /cosine_rekomendasi (coba /api/… kalau di belakang reverse proxy)
    try {
      data = await fetchJSON(`/cosine_rekomendasi?query=${encodeURIComponent(pesan)}&k=5`);
    } catch {
      data = await fetchJSON(`/api/cosine_rekomendasi?query=${encodeURIComponent(pesan)}&k=5`);
    }

    clearInterval(itv);

    if (!data.ok) {
      botMsg.textContent = "❌ Gagal: " + (data.error || "Unknown");
      return;
    }

    const list = data.rekomendasi || [];
    if (list.length === 0){
      botMsg.textContent = "🤖 Maaf, tidak ada hasil yang cocok.";
      return;
    }

    let html = "🤖 Rekomendasi berdasarkan Cosine Similarity:\n\n";
    list.forEach((r, i) => {
      html += `
${i+1}. ${r.nama_mobil || ""} (${r.tahun || ""})
Skor: ${r.cosine_score}
Harga: ${r.harga}
Usia: ${r.usia ?? "-"} tahun
Bahan Bakar: ${r.bahan_bakar || "-"}
Transmisi: ${r.transmisi || "-"}
Kapasitas Mesin: ${r.kapasitas_mesin || "-"}\n`;
    });
    botMsg.textContent = html;
  } catch(e){
    clearInterval(itv);
    botMsg.textContent = "❌ Gagal mengambil jawaban (" + e.message + ").";
  } finally {
    input.disabled = false;
    input.focus();
    chatBox.scrollTop = chatBox.scrollHeight;
  }
}

input.addEventListener("keypress", (e) => {
  if (e.key === "Enter") kirimPertanyaan();
});
</script>
</body>
</html>
